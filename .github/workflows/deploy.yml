name: Deploy ke EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-southeast-3
  INSTANCE_ID: i-0fca1338346e90453
  ROLE: arn:aws:iam::521827759377:role/deploy-via-ssm

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Jalankan deploy lewat SSM
        run: |
          CMD=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters 'commands=["/usr/local/bin/deploy-warkah.sh"]' \
            --query Command.CommandId --output text)

          aws ssm wait command-executed --command-id "$CMD" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' --output text
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" \
            --query 'StandardErrorContent' --output text

          STATUS=$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          echo "Status: $STATUS"
          [ "$STATUS" = "Success" ] || exit 1